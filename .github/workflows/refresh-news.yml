name: Refresh news digest

# Rebuilds the site on Cloudflare Pages so "Điểm tin giáo dục" (fetched from RSS at build time) stays current.
# Needs repo secret CF_PAGES_DEPLOY_HOOK = the Deploy Hook URL from Cloudflare Pages > Settings > Builds & deployments.
on:
  schedule:
    - cron: '0 23,5,11 * * *' # 06:00, 12:00, 18:00 Vietnam time (cron is UTC)
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call Cloudflare Pages deploy hook
        env:
          HOOK: ${{ secrets.CF_PAGES_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "::error::Secret CF_PAGES_DEPLOY_HOOK is not set"; exit 1; fi
          curl -fsS -X POST "$HOOK"
